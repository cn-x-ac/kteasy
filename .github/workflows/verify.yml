name: verify

# 门禁链：M0-01 落地「可构建 + 合规骨架 + 最小防污染」；M0-02 补双库 service-matrix（boot-smoke，
# 真连 PG/MySQL 验方言与探活）。提交历史扫描、ArchUnit、覆盖率地板、Flyway 双库迁移仍归 M0-03【框架文档 02】§3。
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: 合规门禁 · 版权头与代码风格（主构建 + build-logic 独立构建）
        run: |
          ./gradlew --no-daemon spotlessCheck
          ./gradlew --no-daemon -p build-logic spotlessCheck

      - name: 防污染扫描 · 禁止上游源码/文案痕迹
        # 词表外置于 config/compliance/forbidden-terms.txt（固定字符串匹配 -F）；
        # 该文件自身必然含词表，故 --exclude 掉它。命中即失败。正式门禁与提交历史扫描见 M0-03。
        run: |
          TERMS=config/compliance/forbidden-terms.txt
          ! grep -riIF -f <(grep -v '^[[:space:]]*#' "$TERMS") \
            --exclude=forbidden-terms.txt \
            --exclude-dir=.git --exclude-dir=.gradle --exclude-dir=build .

      - name: 构建与单元测试
        run: ./gradlew --no-daemon build

      - name: 上传构建报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: "**/build/reports/**"
          if-no-files-found: ignore

  # M0-02 双库矩阵的运行时证据：本机无 Docker，故真连 PG/MySQL 的启动探活交给 CI service-matrix。
  # 这是「干净环境判定」纪律的落地（M0-01：本机绿不算绿）——DataSourceProbeSmokeTest 仅在 KTEASY_IT_DB=true 时启用。
  boot-smoke:
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        dialect: [pg, mysql]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: kteasy
          POSTGRES_USER: kteasy
          POSTGRES_PASSWORD: kteasy
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kteasy -d kteasy"
          --health-interval 5s --health-timeout 3s --health-retries 12
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: kteasy
          MYSQL_USER: kteasy
          MYSQL_PASSWORD: kteasy
          MYSQL_ROOT_PASSWORD: rootpass
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -prootpass"
          --health-interval 5s --health-timeout 5s --health-retries 24
    env:
      SPRING_PROFILES_ACTIVE: ${{ matrix.dialect }}
      KTEASY_IT_DB: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: JDBC 探活冒烟（真连本 dialect 的库，校验驱动/产品与方言一致 + 虚拟线程并发取连接）
        run: ./gradlew --no-daemon :kteasy-server:test --tests "cn.x.ac.kteasy.server.DataSourceProbeSmokeTest"
