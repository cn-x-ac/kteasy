name: verify

# 门禁链：M0-01 落地「可构建 + 合规骨架 + 最小防污染」；M0-02 补双库 service-matrix（boot-smoke，
# 真连 PG/MySQL 验方言与探活）。提交历史扫描、ArchUnit、覆盖率地板、Flyway 双库迁移仍归 M0-03【框架文档 02】§3。
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false

      - name: 合规门禁 · 版权头与代码风格（主构建 + build-logic 独立构建）
        run: |
          ./gradlew --no-daemon spotlessCheck
          ./gradlew --no-daemon -p build-logic spotlessCheck

      - name: 防污染扫描 · 禁止上游源码/文案痕迹（工作树）
        # 词表外置于 config/compliance/forbidden-terms.txt（固定串 -F）；M0-03 起词表已扩容，具体条目只存活在该文件里，
        # 本步与门禁定义均不复述词表字面量（否则扫描命中自身）。
        # 词表文件自身与 README/NOTICE（允许提及参照实现之名）由 --exclude 排除；命中即失败。
        # 提交历史全量扫描属 1.0.0 发布门（【框架文档 04】§4），不在本步。
        run: |
          TERMS=config/compliance/forbidden-terms.txt
          ! grep -riIF -f <(grep -v '^[[:space:]]*#' "$TERMS") \
            --exclude=forbidden-terms.txt --exclude=README.md --exclude=NOTICE \
            --exclude-dir=.git --exclude-dir=.gradle --exclude-dir=build .

      - name: 构建与单元测试
        run: ./gradlew --no-daemon build

      - name: 上传构建报告
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: "**/build/reports/**"
          if-no-files-found: ignore

  # M0-02 双库矩阵的运行时证据；M0-03 起镜像钉到 MySQL 9.7（LTS）/ PG 18，与 LAN 常设双库同系列。
  # 本机已可直连 LAN 双库补真连证据（跑法见 specs/evidence），本 job 仍保留为「干净环境判定」门禁（M0-01）；
  # DataSourceProbeSmokeTest 仅在 KTEASY_IT_DB=true 时启用。
  boot-smoke:
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        dialect: [pg, mysql]
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: kteasy
          POSTGRES_USER: kteasy
          POSTGRES_PASSWORD: kteasy
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kteasy -d kteasy"
          --health-interval 5s --health-timeout 3s --health-retries 12
      mysql:
        image: mysql:9.7
        env:
          MYSQL_DATABASE: kteasy
          MYSQL_USER: kteasy
          MYSQL_PASSWORD: kteasy
          MYSQL_ROOT_PASSWORD: rootpass
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -prootpass"
          --health-interval 5s --health-timeout 5s --health-retries 24
    env:
      SPRING_PROFILES_ACTIVE: ${{ matrix.dialect }}
      KTEASY_IT_DB: "true"
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false

      - name: 双库启动 smoke + 元数据/方言 SPI 矩阵 + M1-03 物化引擎（Flyway V1–V4 · 列类型映射 · JDBC 探活 · md 治理面 · M1-02 双库等价/EXPLAIN · M1-03 物化/物理化四步断点续跑）
        run: |
          ./gradlew --no-daemon :kteasy-server:test \
            --tests "cn.x.ac.kteasy.server.FlywayMigrationsTest" \
            --tests "cn.x.ac.kteasy.server.DataSourceProbeSmokeTest" \
            --tests "cn.x.ac.kteasy.server.md.MetadataSchemaTest" \
            --tests "cn.x.ac.kteasy.server.md.MetadataGovernanceApiTest" \
            --tests "cn.x.ac.kteasy.server.md.MetadataCacheConcurrencyTest" \
            --tests "cn.x.ac.kteasy.server.dialect.SchemaProviderMatrixTest" \
            --tests "cn.x.ac.kteasy.server.schema.MaterializationIT" \
            --tests "cn.x.ac.kteasy.server.schema.PhysicalizationIT" \
            --tests "cn.x.ac.kteasy.server.schema.SchemaJobApiIT" \
            --tests "cn.x.ac.kteasy.server.schema.StepFailureResumeIT" \
            --tests "cn.x.ac.kteasy.server.schema.KillResumeIT" \
            --tests "cn.x.ac.kteasy.server.schema.PinyinColumnIT" \
            --tests "cn.x.ac.kteasy.server.dialect.TypeCastExtIT" \
            --tests "cn.x.ac.kteasy.server.schema.TypeConvertIT" \
            --tests "cn.x.ac.kteasy.server.query.EqlQueryIT" \
            --tests "cn.x.ac.kteasy.server.query.QueryExitUniquenessIT"
