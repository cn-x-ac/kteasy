# Kteasy 服务端基础配置。方言由 Profile 显式切换（application-pg.yml / application-mysql.yml），
# 本文件不设 spring.profiles.active 默认值——未显式选库即启动失败，杜绝「默认连某个库」的静默降级。
spring:
  application:
    name: kteasy-server
  # 虚拟线程（【规格】§3：JDK 21 开启）：Web MVC 请求与 @Async 走虚拟线程。
  threads:
    virtual:
      enabled: true
  datasource:
    hikari:
      # 启动期不主动建连：方言↔连接串一致性由 DataSourceDialectGuard 在上下文装配阶段 fail-fast 保证，
      # 真实连通性由 JDBC 探活冒烟测（CI 双库 service-matrix）验证，而非拖慢正常启动。
      initialization-fail-timeout: -1
      pool-name: kteasy-pool

# 引擎配置命名空间（全部经 KteasyProperties 类型安全绑定，禁散读 @Value）。
kteasy:
  data-dir: ./kteasy-data
  # db.dialect 由 Profile 文件设置（pg | mysql）；此处不放默认值。
  storage:
    endpoint: ${KTEASY_S3_ENDPOINT:}
    bucket: ${KTEASY_S3_BUCKET:}
    region: ${KTEASY_S3_REGION:}
    access-key: ${KTEASY_S3_ACCESS_KEY:}
    secret-key: ${KTEASY_S3_SECRET_KEY:}
  automation:
    js:
      enabled: false # 本卡只留配置位，装配与预热在 M3b

# JSON 结构化日志为可选项：需要时设 `logging.structured.format.console=ecs`（Boot 内置，无需额外依赖）。
# traceId 由 TraceIdFilter 写入 MDC，logback-spring.xml 的 pattern 预留 %X{traceId} 位。
logging:
  pattern:
    level: "%5p [traceId=%X{traceId:-}]"
